    <rect x="770" y="380" width="160" height="64" rx="12"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="46" y="142" font-size="15" font-weight="700">AssistantPanel</text>
    <text x="46" y="162" font-size="12" fill="#526078">talk button, text box</text>
    <text x="46" y="180" font-size="12" fill="#526078">Cancel, chips, Undo</text>
    <text x="46" y="405" font-size="15" font-weight="700">ResultsGrid</text>
    <text x="46" y="425" font-size="12" fill="#526078">cards and skeletons</text>
    <text x="264" y="228" font-size="16" font-weight="700">ConversationStore</text>
    <text x="264" y="252" font-size="12" fill="#526078">phase</text>
    <text x="264" y="270" font-size="12" fill="#526078">active turn, draft</text>
    <text x="264" y="288" font-size="12" fill="#526078">filters</text>
    <text x="264" y="306" font-size="12" fill="#526078">results and total</text>
    <text x="264" y="330" font-size="12" fill="#526078">validates every reply</text>
    <text x="514" y="135" font-size="15" font-weight="700">SpeechClient</text>
    <text x="514" y="155" font-size="12" fill="#526078">socket, speechSynthesis</text>
    <text x="514" y="270" font-size="15" font-weight="700">IntentClient</text>
    <text x="514" y="290" font-size="12" fill="#526078">text in, raw reply out</text>
    <text x="514" y="405" font-size="15" font-weight="700">CatalogGateway</text>
    <text x="514" y="425" font-size="12" fill="#526078">facets and search</text>
    <text x="850" y="137" font-size="15" font-weight="700" text-anchor="middle">Speech service</text>
    <text x="850" y="155" font-size="12" fill="#526078" text-anchor="middle">recognition</text>
    <text x="850" y="272" font-size="15" font-weight="700" text-anchor="middle">Intent service</text>
    <text x="850" y="290" font-size="12" fill="#526078" text-anchor="middle">the model</text>
    <text x="850" y="407" font-size="15" font-weight="700" text-anchor="middle">Catalog API</text>
    <text x="850" y="425" font-size="12" fill="#526078" text-anchor="middle">products, prices, stock</text>
  </g>
