<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="vs-flow-title vs-flow-desc">
  <title id="vs-flow-title">Voice shopping turn flow</title>
  <desc id="vs-flow-desc">The assistant panel sends taps and text to the conversation store, which sends the phase, chips and choices back. The store asks the speech client to listen, which streams audio to the speech service and returns the transcript, and to speak the summary through speechSynthesis. The store sends the text and its context through the intent client to the intent service and validates the raw reply. It gets facets and products through the catalog gateway, and sends the products to the results grid.</desc>
  <rect width="960" height="540" rx="24" fill="#f7f9fc"/>
  <text x="48" y="56" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">One turn: the store runs every client; the catalog supplies products</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="117" y="98">Shopper side</text>
    <text x="345" y="98">Store</text>
    <text x="595" y="98">Clients</text>
    <text x="850" y="98">Services</text>
  </g>
  <g fill="#ffffff" stroke="#9aa7bc" stroke-width="2">
    <rect x="32" y="118" width="170" height="92" rx="12"/>
    <rect x="32" y="380" width="170" height="64" rx="12"/>
    <rect x="250" y="200" width="190" height="150" rx="14"/>
    <rect x="500" y="110" width="190" height="64" rx="12"/>
    <rect x="500" y="245" width="190" height="60" rx="12"/>
    <rect x="500" y="380" width="190" height="64" rx="12"/>
    <rect x="770" y="110" width="160" height="64" rx="12"/>
