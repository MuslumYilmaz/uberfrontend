<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Car rental booking authority flow</title>
  <desc id="desc">The browser sends a branch-local search to the rental backend, which returns priced offers with an expiry. The booking draft creates a server hold with an idempotency key and later confirms a reservation with that hold. Payment stays with a separate provider that returns an opaque reference, and the receipt renders only from the confirmed reservation.</desc>
  <rect width="960" height="540" rx="24" fill="#f7f9fc"/>
  <text x="48" y="56" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">Offers, holds and reservations are server facts</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="160" y="104">Browser</text>
    <text x="540" y="104">Rental backend</text>
    <text x="824" y="104">Payment provider</text>
  </g>
  <g fill="#ffffff" stroke="#9aa7bc" stroke-width="2">
    <rect x="40" y="130" width="240" height="70" rx="14"/>
    <rect x="40" y="250" width="240" height="70" rx="14"/>
    <rect x="40" y="370" width="240" height="70" rx="14"/>
    <rect x="420" y="130" width="240" height="70" rx="14"/>
    <rect x="420" y="250" width="240" height="70" rx="14"/>
    <rect x="420" y="370" width="240" height="70" rx="14"/>
    <rect x="736" y="370" width="176" height="70" rx="14"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="58" y="160" font-size="16" font-weight="700">URL search</text>
    <text x="58" y="184" font-size="13" fill="#526078">branch ids, local times, zone</text>
    <text x="58" y="280" font-size="16" font-weight="700">Booking draft</text>
    <text x="58" y="304" font-size="13" fill="#526078">extras, driver, countdown</text>
    <text x="58" y="400" font-size="16" font-weight="700">Receipt view</text>
    <text x="58" y="424" font-size="13" fill="#526078">renders confirmed state only</text>
    <text x="438" y="160" font-size="16" font-weight="700">Offers</text>
    <text x="438" y="184" font-size="13" fill="#526078">price lines and expiresAt</text>
    <text x="438" y="280" font-size="16" font-weight="700">Hold</text>
    <text x="438" y="304" font-size="13" fill="#526078">holdId, key, server expiry</text>
    <text x="438" y="400" font-size="16" font-weight="700">Reservation</text>
    <text x="438" y="424" font-size="13" fill="#526078">confirmed status and times</text>
    <text x="752" y="400" font-size="16" font-weight="700">Payment</text>
    <text x="752" y="424" font-size="13" fill="#526078">opaque reference</text>
  </g>
  <g stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 165H420" stroke="#315ee8"/>
    <path d="m408 155 12 10-12 10" stroke="#315ee8"/>
    <path d="M280 285H420" stroke="#315ee8"/>
    <path d="m408 275 12 10-12 10" stroke="#315ee8"/>
    <path d="M280 305 420 388" stroke="#7950b8"/>
    <path d="m404 389 16-1-8-14" stroke="#7950b8"/>
    <path d="M420 420H280" stroke="#268455"/>
    <path d="m292 410-12 10 12 10" stroke="#268455"/>
    <path d="M736 405H660" stroke="#9aa7bc" stroke-dasharray="6 6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#526078" text-anchor="middle">
    <text x="350" y="153">GET availability</text>
    <text x="350" y="273">POST hold + key</text>
    <text x="318" y="352">POST reservation</text>
    <text x="350" y="446">confirmed status</text>
  </g>
  <text x="48" y="500" font-family="Arial, sans-serif" font-size="14" fill="#526078">Prices, rental days and expiry come from the server; the browser renders them and keeps customer input.</text>
</svg>
