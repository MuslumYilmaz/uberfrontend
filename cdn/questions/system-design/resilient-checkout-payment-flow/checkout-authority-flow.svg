<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Checkout authority from form to confirmed order</title>
  <desc id="desc">The browser requests a versioned quote and submits one attempt to the merchant backend. Hosted provider fields collect card data, the provider may authenticate, and a webhook updates merchant order state before the browser shows completion.</desc>
  <rect width="960" height="540" rx="24" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="48" y="56" font-size="28" font-weight="700">Intent travels forward; truth comes back from the server</text>
    <text x="48" y="86" font-size="16" fill="#526078">The redirect is a recovery trigger, not a completion signal.</text>
  </g>
  <g stroke="#315ee8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M248 182H356"/>
    <path d="m344 172 12 10-12 10"/>
    <path d="M604 182H712"/>
    <path d="m700 172 12 10-12 10"/>
    <path d="M790 248V330"/>
    <path d="m780 318 10 12 10-12"/>
    <path d="M712 394H604"/>
    <path d="m616 384-12 10 12 10"/>
    <path d="M356 394H248"/>
    <path d="m260 384-12 10 12 10"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="120" width="200" height="126" rx="16" fill="#e9efff" stroke="#315ee8" stroke-width="2"/>
    <text x="72" y="158" font-size="18" font-weight="700" fill="#172033">Checkout browser</text>
    <text x="72" y="187" font-size="14" fill="#526078">editable form + coordinator</text>
    <text x="72" y="212" font-size="14" fill="#526078">quote and attempt display</text>
    <text x="72" y="235" font-size="14" fill="#526078">no PAN or CVC</text>

    <rect x="356" y="110" width="248" height="146" rx="16" fill="#ffffff" stroke="#315ee8" stroke-width="3"/>
    <text x="380" y="149" font-size="18" font-weight="700" fill="#172033">Merchant backend</text>
    <text x="380" y="178" font-size="14" fill="#526078">versioned quote authority</text>
    <text x="380" y="203" font-size="14" fill="#526078">idempotent attempt mapping</text>
    <text x="380" y="228" font-size="14" fill="#526078">order + webhook reconciliation</text>

    <rect x="712" y="120" width="200" height="126" rx="16" fill="#fff3e5" stroke="#c46d16" stroke-width="2"/>
    <text x="736" y="158" font-size="18" font-weight="700" fill="#172033">Payment provider</text>
    <text x="736" y="187" font-size="14" fill="#526078">hosted card fields</text>
    <text x="736" y="212" font-size="14" fill="#526078">payment execution</text>
    <text x="736" y="235" font-size="14" fill="#526078">bank authentication</text>

    <rect x="712" y="330" width="200" height="126" rx="16" fill="#f2ecff" stroke="#7950b8" stroke-width="2"/>
    <text x="736" y="368" font-size="18" font-weight="700" fill="#172033">Provider event</text>
    <text x="736" y="397" font-size="14" fill="#526078">signed webhook</text>
    <text x="736" y="422" font-size="14" fill="#526078">processing or terminal result</text>

    <rect x="356" y="330" width="248" height="126" rx="16" fill="#eaf8ef" stroke="#268455" stroke-width="2"/>
    <text x="380" y="368" font-size="18" font-weight="700" fill="#172033">Authoritative status</text>
    <text x="380" y="397" font-size="14" fill="#526078">attempt phase + order ID</text>
    <text x="380" y="422" font-size="14" fill="#526078">confirmed order unlocks receipt</text>

    <rect x="48" y="330" width="200" height="126" rx="16" fill="#eef8ff" stroke="#2777a8" stroke-width="2"/>
    <text x="72" y="368" font-size="18" font-weight="700" fill="#172033">Truthful UI</text>
    <text x="72" y="397" font-size="14" fill="#526078">review · processing · error</text>
    <text x="72" y="422" font-size="14" fill="#526078">receipt only when confirmed</text>
  </g>
  <text x="48" y="505" font-family="Arial, sans-serif" font-size="15" fill="#526078">Stable quote and attempt identities connect every request, refresh, authentication return, and webhook outcome.</text>
</svg>
