name: Angular Upgrade Visual Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interactions:
    name: Angular Upgrade Controls (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
      - name: Build untouched inline SSR reference and optimize candidate
        working-directory: frontend
        run: |
          npm run test:ssr-styles
          npm run gen:data
          npx ng build --configuration production
          cp -R dist/frontendatlas/browser dist/prime-ssr-inline
          npm run optimize:ssr-styles
      - run: npx playwright test --config=playwright.ssr-styles.config.ts --project=${{ matrix.browser }} --workers=2
        working-directory: frontend
        env:
          CI: '1'
          PLAYWRIGHT_WEB_SERVER: '1'
          PLAYWRIGHT_REUSE_SERVER: '0'
          PLAYWRIGHT_PORT: '4252'
          PLAYWRIGHT_ENABLE_FIREFOX: '1'
          PLAYWRIGHT_ENABLE_WEBKIT: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: angular-upgrade-controls-${{ matrix.browser }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
  visual-parity:
    name: Angular Upgrade Visual Parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      PLAYWRIGHT_REUSE_SERVER: '0'
      PLAYWRIGHT_WEB_SERVER: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Checkout immutable Angular 17 reference
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 68d4939b049e266c1f68efc6b0cf0b94a8854274
          path: angular17-reference
      - name: Apply the intentional interview hub navigation to the reference
        run: |
          git -C angular17-reference apply --check ../frontend/e2e/reference-patches/interview-hub-navigation.patch
          git -C angular17-reference apply ../frontend/e2e/reference-patches/interview-hub-navigation.patch
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20.19.6
      - name: Install reference and copy comparison scenarios
        run: |
          npm --prefix angular17-reference/frontend ci
          cp frontend/e2e/upgrade-visual.spec.ts frontend/e2e/interview-mocks.ts angular17-reference/frontend/e2e/
          cd angular17-reference/frontend
          npx playwright install --with-deps chromium
      - name: Capture Angular 17 reference with the same intended navigation
        working-directory: angular17-reference/frontend
        env:
          PLAYWRIGHT_PORT: '4251'
        run: npx playwright test e2e/upgrade-visual.spec.ts --project=chromium --workers=3 --retries=0 --update-snapshots
      - name: Transfer reference images
        run: |
          mkdir -p frontend/e2e/upgrade-visual.spec.ts-snapshots
          cp angular17-reference/frontend/e2e/upgrade-visual.spec.ts-snapshots/*-linux.png frontend/e2e/upgrade-visual.spec.ts-snapshots/
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
      - name: Install candidate
        working-directory: frontend
        run: npm ci
      - name: Compare candidate without updating references
        working-directory: frontend
        env:
          PLAYWRIGHT_PORT: '4252'
        run: npx playwright test e2e/upgrade-visual.spec.ts --project=chromium --workers=3 --retries=0
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: angular-upgrade-visual-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e/upgrade-visual.spec.ts-snapshots/
            angular17-reference/frontend/playwright-report/
            angular17-reference/frontend/test-results/
