name: WebKit Critical

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-critical:
    name: WebKit Critical
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Verify WebKit runtime
        run: node scripts/check-playwright-webkit-health.mjs

      - name: Run the critical suite in WebKit (mocked billing, no real checkout)
        run: npm run test:e2e:critical:webkit
        env:
          CI: true

      - name: Upload Playwright artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webkit-critical-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
