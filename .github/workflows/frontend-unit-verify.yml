name: Frontend Unit Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-unit-verify:
    name: Frontend Unit Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for interview-bank verification
        run: npx playwright install --with-deps chromium

      - name: Run frontend unit and content verification
        run: npm run verify:unit-and-content
